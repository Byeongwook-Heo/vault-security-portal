services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: security_portal
      POSTGRES_USER: security_portal
      POSTGRES_PASSWORD: security_portal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_portal -d security_portal"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - portal-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://security_portal:security_portal@postgres:5432/security_portal
      FRONTEND_ORIGIN: http://localhost:3000
      VAULT_MODE: mock
      VAULT_AUTH_MODE: mock
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  portal-postgres:
