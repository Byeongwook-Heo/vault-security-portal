# Retry after converting the remaining Portal test import to the external Factory package.
name: Externalize Vault Plugin Factory

on:
  push:
    branches:
      - refactor/externalize-plugin-factory
    paths:
      - .github/workflows/externalize-plugin-factory.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Replace embedded Factory core with pinned external package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          factory_commit = "1eca6b73c6c743c54ca4a57f0003a28e4a03f6d0"

          package_path = Path("apps/backend/package.json")
          package = json.loads(package_path.read_text())
          deps = package["dependencies"]
          deps["@vault-plugin-factory/core"] = f"github:Byeongwook-Heo/vault-plugin-factory#{factory_commit}"
          for name in ["@aws-sdk/client-codebuild", "@aws-sdk/client-s3", "@aws-sdk/client-ssm", "jszip"]:
              deps.pop(name, None)
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          index_path = Path("apps/backend/src/index.ts")
          index = index_path.read_text()
          old_imports = '''import { generateVaultPluginScaffold, vaultPluginTemplates } from "./plugin-factory/catalog";
          import { FactoryAssistant } from "./plugin-factory/factory-assistant";
          import {
            factoryArtifactEvidence,
            factoryArtifactFingerprint,
            hasVerifiedFactoryArtifact
          } from "./plugin-factory/factory-artifact";
          import { FactoryBuildService } from "./plugin-factory/factory-build-service";
          import {
            recoverStalledFactoryBuildJobs,
            restoreCompletedFactoryBuildSnapshots
          } from "./plugin-factory/factory-job-recovery";
          import { FactoryRequirementsInterviewer } from "./plugin-factory/factory-requirements";
          import { VaultPluginDistributor } from "./plugin-factory/plugin-distributor";
          '''
          new_imports = '''import {
            FactoryAssistant,
            FactoryBuildService,
            FactoryRequirementsInterviewer,
            VaultPluginDistributor,
            factoryArtifactEvidence,
            factoryArtifactFingerprint,
            generateVaultPluginScaffold,
            hasVerifiedFactoryArtifact,
            normalizeManagedMountPath,
            resolveManagedPluginMount,
            vaultPluginTemplates
          } from "@vault-plugin-factory/core";
          import {
            recoverStalledFactoryBuildJobs,
            restoreCompletedFactoryBuildSnapshots
          } from "./plugin-factory/factory-job-recovery";
          '''
          if old_imports not in index:
              raise SystemExit("Expected embedded Factory import block was not found")
          index = index.replace(old_imports, new_imports)
          old_guard = 'import { normalizeManagedMountPath, resolveManagedPluginMount } from "./vault/plugin-mount-guard";\n'
          if old_guard not in index:
              raise SystemExit("Expected local plugin mount guard import was not found")
          index = index.replace(old_guard, "")
          index_path.write_text(index)

          recovery_path = Path("apps/backend/src/plugin-factory/factory-job-recovery.ts")
          recovery = recovery_path.read_text()
          recovery = recovery.replace(
              'import { generateVaultPluginScaffold } from "./catalog";\nimport { hasVerifiedFactoryArtifact } from "./factory-artifact";\n',
              'import { generateVaultPluginScaffold, hasVerifiedFactoryArtifact } from "@vault-plugin-factory/core";\n'
          )
          recovery_path.write_text(recovery)

          workflow_test_path = Path("apps/backend/test/workflow.test.ts")
          workflow_test = workflow_test_path.read_text()
          workflow_test = workflow_test.replace(
              'import { generateVaultPluginScaffold, vaultPluginTemplates } from "../src/plugin-factory/catalog";\nimport { factoryExpansionReservedTargets, factoryExpansionTemplates } from "../src/plugin-factory/expansion-catalog";\n',
              'import {\n  factoryExpansionReservedTargets,\n  factoryExpansionTemplates,\n  generateVaultPluginScaffold,\n  vaultPluginTemplates\n} from "@vault-plugin-factory/core";\n'
          )
          workflow_test_path.write_text(workflow_test)

          readme_path = Path("README.md")
          readme = readme_path.read_text().replace(
              '- Vault 연동 어댑터, 인벤토리, Plugin Factory 및 빌드·배포 지원',
              '- Vault 연동 어댑터와 인벤토리, [Vault Plugin Factory](https://github.com/Byeongwook-Heo/vault-plugin-factory) 호출·승인 UI/오케스트레이션'
          )
          if '## 관련 프로젝트' not in readme:
              readme += '\n## 관련 프로젝트\n\n- [Vault Plugin Factory](https://github.com/Byeongwook-Heo/vault-plugin-factory) — Custom Plugin 설계·생성·빌드·검증·배포\n'
          readme_path.write_text(readme)

          readme_en_path = Path("README.en.md")
          readme_en = readme_en_path.read_text().replace(
              '- Vault adapters, inventory, Plugin Factory, and build/distribution support',
              '- Vault adapters and inventory plus [Vault Plugin Factory](https://github.com/Byeongwook-Heo/vault-plugin-factory) invocation/approval UI and orchestration'
          )
          if '## Related project' not in readme_en:
              readme_en += '\n## Related project\n\n- [Vault Plugin Factory](https://github.com/Byeongwook-Heo/vault-plugin-factory) — custom-plugin design, generation, build, validation, and distribution\n'
          readme_en_path.write_text(readme_en)

          phase_path = Path("docs/phase-plan.md")
          phase = phase_path.read_text()
          phase = phase.replace(
              '## Phase 3 - Custom Vault Plugin Skeletons\n\n- Add Go skeletons for GitLab, Jenkins, and legacy API token plugins.\n- Add build and registration examples.\n\n## Phase 4 - Vault Terraform\n\n- Register plugins.\n- Mount plugin engines.\n- Configure policies and roles.',
              '## Phase 3 - Vault Plugin Factory Integration\n\n- Consume the separately maintained [vault-plugin-factory](https://github.com/Byeongwook-Heo/vault-plugin-factory) core package.\n- Keep user approval, job persistence, audit, and UI orchestration in this Portal.\n- Pin a reviewed Factory commit or release instead of duplicating Factory source.\n\n## Phase 4 - Approved Vault Deployment Integration\n\n- Invoke approved plugin registration and mount operations through the Factory/deployment boundary.\n- Keep Portal-specific policy, approval, and audit integration here.\n- Maintain canonical Factory build infrastructure and plugin templates in `vault-plugin-factory`.'
          )
          phase_path.write_text(phase)
          PY

          rm -f \
            apps/backend/src/plugin-factory/catalog.ts \
            apps/backend/src/plugin-factory/expansion-catalog.ts \
            apps/backend/src/plugin-factory/factory-artifact.ts \
            apps/backend/src/plugin-factory/factory-assistant.ts \
            apps/backend/src/plugin-factory/factory-build-service.ts \
            apps/backend/src/plugin-factory/factory-requirements.ts \
            apps/backend/src/plugin-factory/github-pat-rotation-template.ts \
            apps/backend/src/plugin-factory/plugin-distributor.ts \
            apps/backend/src/vault/plugin-mount-guard.ts \
            apps/backend/test/factory-artifact.test.ts \
            apps/backend/test/factory-assistant.test.ts \
            apps/backend/test/factory-build-service.test.ts \
            apps/backend/test/factory-requirements.test.ts \
            apps/backend/test/plugin-distributor.test.ts \
            apps/backend/test/plugin-mount-guard.test.ts

      - name: Update dependency lock and validate Portal
        run: |
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Commit externalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "refactor: consume external Vault Plugin Factory core"
          git push origin HEAD:refactor/externalize-plugin-factory
